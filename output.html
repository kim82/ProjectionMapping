<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Projection Output</title>
    <link rel="icon" href="image/favicon.ico">
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden
        }

        canvas {
            width: 100vw;
            height: 100vh;
            display: block
        }

        #start {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            color: #aaa;
            font: 18px system-ui;
            cursor: pointer;
            background: #000;
            text-align: center;
            padding: 24px
        }

        #start[hidden] {
            display: none
        }

        body.run {
            cursor: none
        }
    </style>
</head>

<body><canvas id="gl"></canvas>
    <div id="start">Click to start output<br>(enters fullscreen and enables audio)</div>
    <script type="module" src="js/output.js"></script>
</body>

</html>
