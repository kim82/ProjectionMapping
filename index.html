<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Projection Mapper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="image/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="image/favicon-16x16.png">
</head>

<body>
    <header id="top">
        <h1>Projection Mapper</h1><span id="status"></span><span id="out-status" class="ha-indicator">Connecting...</span>
    </header>
    <main id="stage"><canvas id="overlay"></canvas>
        <div id="error" hidden></div>
    </main>
    <section id="panel">
        <div class="row">
            <button id="load">Load Loop Video</button><input id="file" type="file" accept="video/*" hidden>
            <button id="loadtrig">Load Trigger Video</button><input id="file2" type="file" accept="video/*" hidden>
            <button id="trigger">Trigger / Skip (T)</button>
            <button id="test" class="toggle">Test Pattern</button>
            <button id="grid" class="toggle">Grid</button>
            <button id="reset">Reset Mapping</button>
            <button id="ha-settings">Home Assistant</button>
            <div id="ha-status" class="ha-indicator" aria-live="polite">
                <span id="ha-led" class="ha-dot"></span>
                <span id="ha-status-text">Disconnected</span>
            </div>
        </div>
        <div class="row">
            <button id="play">Play</button><button id="restart">Restart</button>
            <button id="loop" class="toggle">Loop</button>
            <input id="seek" type="range" min="0" max="1000" value="0"><span id="time">0:00 / 0:00</span>
        </div>
        <div class="row">
            <button id="mute">Mute</button><input id="vol" type="range" min="0" max="1" step="0.01" value="1">
            <select id="maps"></select><button id="save">Save Mapping</button><button id="loadmap">Load Mapping</button>
            <button id="openout" class="primary">Open Output Screen</button>
        </div>
    </section>
    <dialog id="ha-dialog">
        <form id="ha-form">
            <div class="dialog-header">
                <h2>Home Assistant settings</h2>
                <button type="button" id="ha-dialog-close" class="icon-button" aria-label="Close">×</button>
            </div>
            <label>WebSocket URL
                <input id="ha-url" type="url" placeholder="wss://homeassistant.local:8123/api/websocket" required>
            </label>
            <label>Access token
                <input id="ha-token" type="password" placeholder="Long-lived access token" required>
            </label>
            <label>Motion entity
                <input id="ha-motion-entity" type="text" placeholder="binary_sensor.front_motion" required>
            </label>
            <div class="dialog-actions">
                <button type="button" id="ha-dialog-cancel">Cancel</button>
                <button type="submit" class="primary">Save</button>
            </div>
        </form>
    </dialog>
        <script type="module" src="js/controller.js"></script>
</body>

</html>
